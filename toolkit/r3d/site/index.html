<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#ov{position:absolute;inset:0;pointer-events:none;font-family:'Inter Display',Inter,sans-serif;color:#fff}
.brand{position:absolute;left:58px;top:146px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:30px;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.brand .l{width:34px;height:34px;border-radius:7px;background:#fff;color:#d7263d;font-weight:900;font-size:26px;display:grid;place-items:center;border:3px solid #d7263d;box-sizing:border-box}
.handle{position:absolute;right:58px;top:150px;font-weight:600;font-size:28px;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.prog{position:absolute;left:0;top:0;height:9px;background:#FFD400}
.headwrap{position:absolute;left:60px;right:60px;top:205px;text-align:center;text-shadow:0 4px 18px rgba(0,0,0,.6),0 2px 3px rgba(0,0,0,.5)}
.kicker{font-weight:800;font-size:30px;letter-spacing:3px;text-transform:uppercase;opacity:.92;margin-bottom:6px}
.head{font-weight:900;font-size:76px;line-height:1.04;letter-spacing:-1px}
.hl{color:#FFD400}
.cap{position:absolute;left:50px;right:50px;top:1395px;text-align:center;font-weight:900;font-size:66px;line-height:1.1;text-shadow:0 0 3px #000,0 4px 14px rgba(0,0,0,.85),0 0 1px #000;-webkit-text-stroke:2px rgba(0,0,0,.65);paint-order:stroke fill}
.cap .k{color:#FFD400}
.lab{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-weight:900;font-size:38px;padding:12px 26px;border-radius:999px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lab:after{content:"";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);border:14px solid transparent;border-bottom:0;border-top-color:inherit}
.box{position:absolute;left:90px;right:90px;background:rgba(12,16,26,.88);border-radius:28px;padding:34px 40px;box-shadow:0 20px 60px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.12)}
.box .bt{font-weight:900;font-size:32px;letter-spacing:3px;color:#FFD400;text-transform:uppercase;margin-bottom:14px}
.box .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:44px;padding:14px 0;border-top:2px solid rgba(255,255,255,.12)}
.box .row b{color:#ff4d5e;font-weight:900}
.qopt{display:flex;align-items:center;gap:22px;font-weight:800;font-size:46px;padding:20px 26px;border-radius:20px;background:rgba(255,255,255,.08);margin-top:16px;transition:none}
.qopt .lt{width:62px;height:62px;border-radius:50%;background:#FFD400;color:#111;display:grid;place-items:center;font-weight:900;font-size:38px;flex:none}
.qopt.right{background:#19C15F}.qopt.wrong{background:#EF3B3B}
.stamp{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(-6deg);font-weight:900;font-size:110px;padding:10px 46px;border:10px solid;border-radius:26px;letter-spacing:2px}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:900;text-shadow:0 6px 30px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.6)}
.ep{position:absolute;left:56px;top:140px;display:flex;align-items:center;gap:14px;font-weight:900;font-size:30px;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.ep .bar{width:12px;height:38px;background:#FFD400;border-radius:3px}
.ep .nm{color:#FFD400}
.tag{position:absolute;left:50%;transform:translate(-50%,-50%);white-space:nowrap;font-weight:900;font-size:50px;letter-spacing:2px;text-transform:uppercase;padding:8px 26px;border:5px solid;border-radius:12px;background:rgba(12,12,14,.5);text-shadow:0 2px 6px rgba(0,0,0,.5)}
.tag.red{color:#ff4a4a;border-color:#ff4a4a}.tag.green{color:#3cf07a;border-color:#3cf07a}.tag.yellow{color:#FFD400;border-color:#FFD400}
.word{position:absolute;left:0;right:0;top:1180px;text-align:center;font-weight:900;font-size:84px;letter-spacing:1px;text-transform:uppercase;-webkit-text-stroke:3px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 5px 16px rgba(0,0,0,.7)}
.word.k{color:#FFD400}
</style></head>
<body><div id="ov"></div>
<script type="module" src="./main.js"></script>
</body></html>
